<!DOCTYPE html>
<html>
<head>
  <title>Screen Viewer</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: black;
      overflow: hidden;
      color: white;
      font-family: Arial, sans-serif;
    }
    .videoContainer {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .videoContainer video {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
    #selectionCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      cursor: crosshair;
      background-color: rgba(0, 0, 0, 0.3); /* Semi-transparent overlay */
      display: none; /* Hidden by default */
    }
    #statusOverlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: rgba(0, 0, 0, 0.6);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.5em;
      text-align: center;
    }
    #screenshotBtn {
      position: absolute;
      bottom: 20px;
      right: 20px; /* Adjust position as fullscreenBtn is removed */
      padding: 10px 15px;
      background-color: rgba(50, 50, 50, 0.7);
      color: white;
      border: 1px solid #555;
      border-radius: 5px;
      cursor: pointer;
      opacity: 0.6;
      transition: opacity 0.2s;
    }
    #screenshotBtn:hover {
      opacity: 1;
    }
  </style>
</head>
<body>
  
  <div id="videoContainer" class="videoContainer">
    <video id="remoteVideo" autoplay playsinline muted></video>
    <canvas id="selectionCanvas"></canvas>
    <div id="statusOverlay">
      <div id="statusText">Connecting to server...</div>
    </div>
  </div>
  <button id="screenshotBtn">Screenshot</button>
  <script>
    const socket = new WebSocket('ws://YOUR_SERVER_IP_ADDRESS:59123');
    let peerConnection;
    let iceCandidateQueue = [];
    const video = document.getElementById('remoteVideo');
    const statusOverlay = document.getElementById('statusOverlay');
    const statusText = document.getElementById('statusText');
    const screenshotBtn = document.getElementById('screenshotBtn');
    const videoContainer = document.getElementById('videoContainer');
    const selectionCanvas = document.getElementById('selectionCanvas');
    const selectionCtx = selectionCanvas.getContext('2d');

    let isSelecting = false;
    let selectionStartX, selectionStartY, selectionCurrentX, selectionCurrentY;

    // Helper function to get the video's actual rendered dimensions and position
    function getVideoRenderedDimensions() {
      const videoAspectRatio = video.videoWidth / video.videoHeight;
      const containerWidth = videoContainer.offsetWidth;
      const containerHeight = videoContainer.offsetHeight;
      const containerAspectRatio = containerWidth / containerHeight;

      let renderedWidth, renderedHeight, offsetX, offsetY;

      if (videoAspectRatio > containerAspectRatio) {
        // Video is wider than container, constrained by width
        renderedWidth = containerWidth;
        renderedHeight = containerWidth / videoAspectRatio;
        offsetX = 0;
        offsetY = (containerHeight - renderedHeight) / 2;
      } else {
        // Video is taller than container, constrained by height
        renderedHeight = containerHeight;
        renderedWidth = containerHeight * videoAspectRatio;
        offsetY = 0;
        offsetX = (containerWidth - renderedWidth) / 2;
      }
      return { renderedWidth, renderedHeight, offsetX, offsetY };
    }

    function setStatus(text) {
      statusText.textContent = text;
      statusOverlay.style.display = 'flex';
    }

    function hideStatus() {
      statusOverlay.style.display = 'none';
    }

    function initializePeerConnection() {
      if (peerConnection) {
        peerConnection.close();
      }
      video.srcObject = null;
      iceCandidateQueue = []; // Reset queue for new connection
      peerConnection = new RTCPeerConnection();

      peerConnection.ontrack = (event) => {
        console.log('Received remote track');
        if (event.streams && event.streams[0]) {
          video.srcObject = event.streams[0];
        } else {
          let inboundStream = new MediaStream([event.track]);
          video.srcObject = inboundStream;
        }
        video.play().then(() => {
          hideStatus();
        }).catch(error => console.error("Video play failed:", error));
      };

      peerConnection.onicecandidate = (event) => {
        if (event.candidate) {
          socket.send(JSON.stringify({ type: 'candidate', candidate: event.candidate }));
        }
      };

      peerConnection.onconnectionstatechange = () => {
        console.log(`Peer Connection State: ${peerConnection.connectionState}`);
        if (peerConnection.connectionState === 'disconnected' || peerConnection.connectionState === 'failed') {
          video.srcObject = null;
          setStatus('Connection lost. Waiting for broadcaster...');
        }
      };
    }

    socket.onopen = () => {
      console.log('Connected to signaling server as viewer');
      setStatus('Waiting for stream...');
      socket.send(JSON.stringify({ type: 'viewer' }));
      // Request an offer in case the broadcaster is already active
      socket.send(JSON.stringify({ type: 'request-offer' }));
    };

    socket.onmessage = async (message) => {
      const data = JSON.parse(message.data);

      switch (data.type) {
        case 'offer':
          console.log('Offer received in viewer');
          setStatus('Connecting to peer...');
          initializePeerConnection();
          await peerConnection.setRemoteDescription(new RTCSessionDescription(data.offer));

          // Process any candidates that arrived early
          console.log(`Processing ${iceCandidateQueue.length} queued ICE candidates.`);
          while(iceCandidateQueue.length > 0) {
            const candidate = iceCandidateQueue.shift();
            try {
              await peerConnection.addIceCandidate(candidate);
            } catch (err) {
              console.error('Error adding queued ICE candidate:', err);
            }
          }

          const answer = await peerConnection.createAnswer();
          await peerConnection.setLocalDescription(answer);
          socket.send(JSON.stringify({ type: 'answer', answer: { type: answer.type, sdp: answer.sdp } }));
          break;

        case 'candidate':
          console.log('Received ICE candidate:', data.candidate);
          // Only process if sdpMid and sdpMLineIndex are present
          if (data.candidate && data.candidate.sdpMid !== null && data.candidate.sdpMLineIndex !== null) {
            const candidate = new RTCIceCandidate(data.candidate);
            if (peerConnection && peerConnection.remoteDescription) {
              // If connection is ready, add candidate immediately
              try {
                await peerConnection.addIceCandidate(candidate);
              } catch (err) {
                console.error('Error adding ICE candidate:', err);
              }
            } else {
              // Otherwise, queue it for later
              console.log('Queuing ICE candidate.');
              iceCandidateQueue.push(candidate);
            }
          } else {
            console.warn('Received malformed ICE candidate (sdpMid or sdpMLineIndex is null):', data.candidate);
          }
          break;
        
        case 'broadcaster-disconnected':
          console.log('Broadcaster has disconnected.');
          if (peerConnection) {
            peerConnection.close();
            peerConnection = null;
          }
          video.srcObject = null;
          setStatus('Stream ended. Waiting for broadcaster...');
          break;
      }
    };

    socket.onclose = () => {
      console.log('Disconnected from signaling server.');
      if (peerConnection) {
        peerConnection.close();
      }
      video.srcObject = null;
      setStatus('Disconnected from server. Please refresh.');
    };

    screenshotBtn.addEventListener('click', () => {
      if (video.srcObject && !video.paused) {
        if (!isSelecting) {
          // Enter selection mode
          selectionCanvas.style.display = 'block';
          screenshotBtn.textContent = 'Cancel Selection';
          isSelecting = true;
          selectionCanvas.width = videoContainer.offsetWidth;
          selectionCanvas.height = videoContainer.offsetHeight;
          selectionCtx.clearRect(0, 0, selectionCanvas.width, selectionCanvas.height);
        } else {
          // Exit selection mode without taking screenshot
          selectionCanvas.style.display = 'none';
          screenshotBtn.textContent = 'Screenshot';
          isSelecting = false;
          selectionCtx.clearRect(0, 0, selectionCanvas.width, selectionCanvas.height);
        }
      } else {
        alert('No video stream available or video is paused.');
      }
    });

    selectionCanvas.addEventListener('mousedown', (e) => {
      if (isSelecting) {
        const rect = selectionCanvas.getBoundingClientRect();
        const { renderedWidth, renderedHeight, offsetX, offsetY } = getVideoRenderedDimensions();

        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;

        // Adjust mouse coordinates relative to the rendered video area on the canvas
        selectionStartX = mouseX - offsetX;
        selectionStartY = mouseY - offsetY;

        selectionCurrentX = selectionStartX;
        selectionCurrentY = selectionStartY;

        // Set canvas dimensions to match video container dimensions for accurate drawing
        selectionCanvas.width = videoContainer.offsetWidth;
        selectionCanvas.height = videoContainer.offsetHeight;
        selectionCtx.clearRect(0, 0, selectionCanvas.width, selectionCanvas.height);
      }
    });

    selectionCanvas.addEventListener('mousemove', (e) => {
      if (isSelecting && selectionStartX !== undefined) {
        const rect = selectionCanvas.getBoundingClientRect();
        const { offsetX, offsetY } = getVideoRenderedDimensions();

        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;

        selectionCurrentX = mouseX - offsetX;
        selectionCurrentY = mouseY - offsetY;

        selectionCtx.clearRect(0, 0, selectionCanvas.width, selectionCanvas.height);
        selectionCtx.strokeStyle = 'red';
        selectionCtx.lineWidth = 2;
        // Draw the rectangle using coordinates relative to the rendered video area on the canvas
        selectionCtx.strokeRect(offsetX + selectionStartX, offsetY + selectionStartY, selectionCurrentX - selectionStartX, selectionCurrentY - selectionStartY);
      }
    });

    selectionCanvas.addEventListener('mouseup', () => {
      if (isSelecting && selectionStartX !== undefined) {
        isSelecting = false;
        selectionCanvas.style.display = 'none';
        screenshotBtn.textContent = 'Screenshot';

        const { renderedWidth, renderedHeight, offsetX, offsetY } = getVideoRenderedDimensions();

        // Calculate selection coordinates relative to the rendered video area on the canvas
        const x_rendered_on_canvas = Math.min(selectionStartX, selectionCurrentX);
        const y_rendered_on_canvas = Math.min(selectionStartY, selectionCurrentY);
        const width_rendered_on_canvas = Math.abs(selectionCurrentX - selectionStartX);
        const height_rendered_on_canvas = Math.abs(selectionCurrentY - selectionStartY);

        if (width_rendered_on_canvas > 0 && height_rendered_on_canvas > 0) {
          // Scale rendered coordinates to video's intrinsic resolution
          const x_intrinsic = (x_rendered_on_canvas / renderedWidth) * video.videoWidth;
          const y_intrinsic = (y_rendered_on_canvas / renderedHeight) * video.videoHeight;
          const width_intrinsic = (width_rendered_on_canvas / renderedWidth) * video.videoWidth;
          const height_intrinsic = (height_rendered_on_canvas / renderedHeight) * video.videoHeight;

          const tempCanvas = document.createElement('canvas');
          tempCanvas.width = width_intrinsic;
          tempCanvas.height = height_intrinsic;
          const tempCtx = tempCanvas.getContext('2d');

          tempCtx.drawImage(video, x_intrinsic, y_intrinsic, width_intrinsic, height_intrinsic, 0, 0, width_intrinsic, height_intrinsic);

          const dataURL = tempCanvas.toDataURL('image/png');
          const a = document.createElement('a');
          a.href = dataURL;
          a.download = `screenshot-area-${new Date().toISOString()}.png`;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
        } else {
          alert('No area selected for screenshot.');
        }
        selectionStartX = undefined; // Reset selection coordinates
        selectionStartY = undefined;
        selectionCtx.clearRect(0, 0, selectionCanvas.width, selectionCanvas.height);
      }
    });
  </script>
</body>
</html>
