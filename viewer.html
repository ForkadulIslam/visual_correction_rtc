<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Screen Viewer - AI Assistant</title>
  <style>
    :root {
      --primary-color: #4285f4;
      --bg-dark: #000000;
      --panel-bg: rgba(20, 20, 20, 0.85); /* Semi-transparent */
      --text-main: #ffffff;
      --accent: #bada55;
    }

    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: var(--bg-dark);
      overflow: hidden;
      color: var(--text-main);
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    /* Main Container */
    .view-root {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Video scaling */
    #remoteVideo {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      z-index: 1;
    }

    /* Selection Layer */
    #selectionCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      cursor: crosshair;
      background-color: rgba(0, 0, 0, 0.4);
      display: none;
      z-index: 10;
    }

    /* Status Overlay */
    #statusOverlay {
      position: absolute;
      inset: 0;
      background-color: rgba(0, 0, 0, 0.9);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 100;
    }

    .loader {
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top: 3px solid var(--primary-color);
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin-bottom: 15px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Left Side Controls */
    .side-controls {
      position: absolute;
      left: 20px; /* Moved to left */
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 15px;
      z-index: 50;
    }

    .action-btn {
      width: 50px;
      height: 50px;
      background: rgba(40, 40, 40, 0.7);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      color: white;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: all 0.2s ease;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }

    .action-btn:hover {
      background: var(--primary-color);
      transform: scale(1.05);
    }

    .action-btn.active {
      background: #ff4444;
      border-color: #ff4444;
    }

    /* Analysis Panel */
    #analysisPanel {
      position: absolute;
      top: 0;
      left: -420px; /* Hidden state - Moved to left */
      width: 400px;
      height: 100vh;
      background: var(--panel-bg);
      backdrop-filter: blur(15px);
      border-right: 1px solid rgba(255, 255, 255, 0.1); /* Border on right now */
      transition: left 0.4s cubic-bezier(0.19, 1, 0.22, 1);
      z-index: 60;
      display: flex;
      flex-direction: column;
    }

    #analysisPanel.visible {
      left: 0; /* Visible state - Moved to left */
    }

    .panel-header {
      padding: 25px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .panel-header h2 {
      margin: 0;
      font-size: 1.2em;
      color: var(--primary-color);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .close-panel {
      background: none;
      border: none;
      color: #888;
      font-size: 24px;
      cursor: pointer;
    }

    .panel-content {
      flex: 1;
      padding: 25px;
      overflow-y: auto;
      line-height: 1.6;
      font-size: 0.95em;
    }

    .panel-content strong {
      display: block;
      margin-top: 20px;
      color: var(--accent);
      font-size: 0.9em;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Structured Answer UI */
    .answer-card {
      background: rgba(66, 133, 244, 0.15);
      border: 1px solid rgba(66, 133, 244, 0.3);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 25px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }

    .section-label {
      font-size: 0.75em;
      text-transform: uppercase;
      color: var(--primary-color);
      font-weight: 800;
      letter-spacing: 1.5px;
      margin-bottom: 10px;
      display: block;
    }

    .main-answer {
      font-size: 1.3em;
      font-weight: 600;
      line-height: 1.4;
      color: #fff;
    }

    .logic-text {
      font-size: 0.95em;
      line-height: 1.6;
      color: #ccc;
      padding-left: 5px;
      border-left: 2px solid rgba(255,255,255,0.1);
    }

    .task-summary {
      font-size: 0.85em;
      color: #666;
      font-style: italic;
      margin-top: 30px;
      text-align: right;
    }

    .loading-text {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #888;
    }
  </style>
</head>
<body>

  <div class="view-root">
    <!-- Shared Screen -->
    <video id="remoteVideo" autoplay playsinline muted></video>
    
    <!-- Interaction Layer -->
    <canvas id="selectionCanvas"></canvas>

    <!-- Left Side Buttons -->
    <div class="side-controls">
      <button id="screenshotBtn" class="action-btn" title="Analyze Screen Area">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M12 8v8m-4-4h8"/></svg>
      </button>
      <button id="togglePanelBtn" class="action-btn" title="View Results">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      </button>
    </div>

    <!-- Results Panel -->
    <div id="analysisPanel">
      <div class="panel-header">
        <h2><span>✨</span> Gemini Analysis</h2>
        <button class="close-panel" id="closePanelBtn">&times;</button>
      </div>
      <div id="panelContent" class="panel-content">
        <p style="color: #666;">Ready for analysis. Click the [+] button to select an area.</p>
      </div>
    </div>

    <!-- Connection Overlay -->
    <div id="statusOverlay">
      <div class="loader"></div>
      <div id="statusText">Establishing Connection...</div>
    </div>
  </div>

  <script>
    const socket = new WebSocket('ws://' + location.host);
    let peerConnection;
    let iceCandidateQueue = [];
    
    const video = document.getElementById('remoteVideo');
    const statusOverlay = document.getElementById('statusOverlay');
    const statusText = document.getElementById('statusText');
    const screenshotBtn = document.getElementById('screenshotBtn');
    const selectionCanvas = document.getElementById('selectionCanvas');
    const selectionCtx = selectionCanvas.getContext('2d');
    const analysisPanel = document.getElementById('analysisPanel');
    const panelContent = document.getElementById('panelContent');
    const togglePanelBtn = document.getElementById('togglePanelBtn');
    const closePanelBtn = document.getElementById('closePanelBtn');

    let isSelecting = false;
    let startX, startY, currentX, currentY;

    // --- Panel Management ---
    function togglePanel(force) {
      const show = typeof force === 'boolean' ? force : !analysisPanel.classList.contains('visible');
      analysisPanel.classList.toggle('visible', show);
    }

    togglePanelBtn.onclick = () => togglePanel();
    closePanelBtn.onclick = () => togglePanel(false);

    // --- WebRTC Setup ---
    function setStatus(text) {
      statusText.textContent = text;
      statusOverlay.style.display = 'flex';
    }

    function hideStatus() {
      statusOverlay.style.display = 'none';
    }

    function initializePeerConnection() {
      if (peerConnection) peerConnection.close();
      peerConnection = new RTCPeerConnection();

      peerConnection.ontrack = (event) => {
        video.srcObject = event.streams[0] || new MediaStream([event.track]);
        video.play().then(hideStatus).catch(console.error);
      };

      peerConnection.onicecandidate = (event) => {
        if (event.candidate) {
          socket.send(JSON.stringify({ type: 'candidate', candidate: event.candidate }));
        }
      };

      peerConnection.onconnectionstatechange = () => {
        if (['disconnected', 'failed'].includes(peerConnection.connectionState)) {
          setStatus('Waiting for stream...');
        }
      };
    }

    socket.onopen = () => {
      setStatus('Connecting to host...');
      socket.send(JSON.stringify({ type: 'viewer' }));
      socket.send(JSON.stringify({ type: 'request-offer' }));
    };

    socket.onmessage = async (message) => {
      const data = JSON.parse(message.data);
      switch (data.type) {
        case 'offer':
          initializePeerConnection();
          await peerConnection.setRemoteDescription(new RTCSessionDescription(data.offer));
          while(iceCandidateQueue.length > 0) await peerConnection.addIceCandidate(iceCandidateQueue.shift());
          const answer = await peerConnection.createAnswer();
          await peerConnection.setLocalDescription(answer);
          socket.send(JSON.stringify({ type: 'answer', answer }));
          break;
        case 'candidate':
          if (data.candidate) {
            const cand = new RTCIceCandidate(data.candidate);
            if (peerConnection && peerConnection.remoteDescription) await peerConnection.addIceCandidate(cand);
            else iceCandidateQueue.push(cand);
          }
          break;
        case 'analysis-response':
          renderStructuredResponse(data.text);
          break;
        case 'analysis-error':
          panelContent.innerHTML = `<span style="color: #ff5555;">Error: ${data.error}</span>`;
          break;
      }
    };

    function renderStructuredResponse(rawJson) {
      try {
        const data = JSON.parse(rawJson);
        panelContent.innerHTML = `
          <div class="answer-card">
            <span class="section-label">Proposed Solution</span>
            <div class="main-answer">${md(data.answer)}</div>
          </div>
          <div style="margin-bottom: 20px;">
            <span class="section-label">Reasoning</span>
            <div class="logic-text">${md(data.logic)}</div>
          </div>
          <div class="task-summary">${escapeHTML(data.task_summary || '')}</div>
        `;
      } catch (e) {
        panelContent.innerHTML = `<div class="logic-text">${md(rawJson)}</div>`;
      }
    }

    function md(text) {
      if (!text) return '';
      let safe = escapeHTML(text);
      return safe
        .replace(/```(?:[a-z]*)\n([\s\S]*?)```/g, '<div class="ocr-box" style="white-space:pre; margin:10px 0;">$1</div>')
        .replace(/`(.*?)`/g, '<code style="background:rgba(255,255,255,0.15); padding:2px 4px; border-radius:4px; font-family:monospace; color:var(--accent);">$1</code>')
        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
        .replace(/\n/g, '<br>');
    }

    function escapeHTML(str) {
      return str.replace(/[&<>"']/g, function(m) {
        return {
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#039;'
        }[m];
      });
    }

    // --- Area Selection ---
    screenshotBtn.onclick = () => {
      if (!video.srcObject) return;
      isSelecting = !isSelecting;
      screenshotBtn.classList.toggle('active', isSelecting);
      selectionCanvas.style.display = isSelecting ? 'block' : 'none';
      if (isSelecting) {
        selectionCanvas.width = window.innerWidth;
        selectionCanvas.height = window.innerHeight;
      }
    };

    selectionCanvas.onmousedown = (e) => {
      if (!isSelecting) return;
      startX = e.clientX;
      startY = e.clientY;
    };

    selectionCanvas.onmousemove = (e) => {
      if (!isSelecting || startX === undefined) return;
      currentX = e.clientX;
      currentY = e.clientY;

      selectionCtx.clearRect(0, 0, selectionCanvas.width, selectionCanvas.height);
      selectionCtx.strokeStyle = '#4285f4';
      selectionCtx.lineWidth = 2;
      selectionCtx.setLineDash([5, 5]);
      selectionCtx.strokeRect(startX, startY, currentX - startX, currentY - startY);
      
      selectionCtx.fillStyle = 'rgba(66, 133, 244, 0.1)';
      selectionCtx.fillRect(startX, startY, currentX - startX, currentY - startY);
    };

    selectionCanvas.onmouseup = () => {
      if (!isSelecting || startX === undefined) return;
      
      const vRect = video.getBoundingClientRect();
      const cropX = (Math.min(startX, currentX) - vRect.left) * (video.videoWidth / vRect.width);
      const cropY = (Math.min(startY, currentY) - vRect.top) * (video.videoHeight / vRect.height);
      const cropW = Math.abs(currentX - startX) * (video.videoWidth / vRect.width);
      const cropH = Math.abs(currentY - startY) * (video.videoHeight / vRect.height);

      if (cropW > 5 && cropH > 5) {
        const tempCanvas = document.createElement('canvas');
        tempCanvas.width = cropW;
        tempCanvas.height = cropH;
        tempCanvas.getContext('2d').drawImage(video, cropX, cropY, cropW, cropH, 0, 0, cropW, cropH);

        panelContent.innerHTML = '<div class="loading-text"><div class="loader" style="width:20px;height:20px;margin:0;"></div> Gemini is analyzing...</div>';
        togglePanel(true);
        
        socket.send(JSON.stringify({
          type: 'analyze-image',
          image: tempCanvas.toDataURL('image/png').split(',')[1]
        }));
      }

      isSelecting = false;
      startX = undefined;
      selectionCanvas.style.display = 'none';
      screenshotBtn.classList.remove('active');
    };
  </script>
</body>
</html>
